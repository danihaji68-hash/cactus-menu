name: Final menu polish

on:
  push:
    paths:
      - '.github/workflows/final-menu-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final visual polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- CACTUS_FINAL_MENU_POLISH -->'
          if marker in s:
              start = s.index(marker)
              end = s.index('</head>', start)
              patch = r'''<!-- CACTUS_FINAL_MENU_POLISH -->
          <style>
          .cactus-final-option {
            border: 4px solid #0a0a0a !important;
            outline: 2px solid #B8860B !important;
            outline-offset: -5px !important;
            color: #000000 !important;
            font-family: Georgia, 'Times New Roman', serif !important;
            font-size: clamp(18px, 4.8vw, 28px) !important;
            font-weight: 700 !important;
            letter-spacing: .4px !important;
            text-shadow: none !important;
            transform: translateY(0.5cm) scale(.95) !important;
            transform-origin: center center !important;
          }
          .cactus-final-return {
            border-color: #B8860B !important;
            color: #B8860B !important;
          }
          </style>
          <script>
          (function(){
            function polish(){
              const labels = ['منو کافه','منو غذا','منو قلیان'];
              const all = Array.from(document.querySelectorAll('a,button,[role="button"],div,span'));
              labels.forEach(function(label){
                const hit = all.find(function(el){
                  const t = (el.textContent || '').replace(/\s+/g,' ').trim();
                  return t === label;
                });
                if(!hit) return;
                let target = hit.closest('a,button,[role="button"]') || hit;
                if(target !== hit && (target.textContent || '').trim() !== label){ target = hit; }
                target.classList.add('cactus-final-option');
              });
              all.forEach(function(el){
                const t = (el.textContent || '').replace(/\s+/g,' ').trim();
                if(t === 'بازگشت به منو اصلی') el.classList.add('cactus-final-return');
              });
            }
            if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', polish);
            else polish();
            setTimeout(polish, 500);
          })();
          </script>
          '''
              s = s[:start] + patch + '\n' + s[end:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit the polished index only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix menu option text color and position'
            git push
          fi
